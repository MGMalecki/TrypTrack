  <path d="M8 45 C7 37 18 34 27 30 C36 26 42 21 49 16 C45 25 38 33 29 39 C20 45 9 53 8 45 Z"
        fill="#8E6CC9" stroke="#4B2E83" stroke-width="2.4" stroke-linejoin="round"/>
