        stroke-width="2.6" stroke-linecap="round"/>
  <!-- nucleus, kinetoplast -->
  <ellipse cx="27" cy="36" rx="4.4" ry="3" transform="rotate(-30 27 36)" fill="#3A1F6B"/>
  <circle cx="13" cy="45" r="2.1" fill="#3A1F6B"/>
</svg>
